<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mandelbrot</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: zoom-in;
  }
  #hud {
    position: fixed;
    right: 12px;
    bottom: 10px;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.85);
    color: #bbb;
    border-radius: 3px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    white-space: pre;
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  #hud.show { opacity: 1; transition: none; }
</style>
</head>
<body>
<canvas id="canvas" aria-label="Animated rendering of the Mandelbrot set"></canvas>
<div id="hud"></div>
<script>
"use strict";
/*
 * High-definition canvas port of mb.py. Same locations and color curve,
 * rendered per pixel in background workers, cycling through the tour.
 *
 * Tour:     space = pause, n / right arrow = next, left arrow = previous
 * Anywhere: p = next palette (remembered), a = toggle auto color range,
 *           h = toggle high-resolution (perturbation) mode,
 *           o = coloring: auto -> orbit trap -> escape time
 * Explore:  click = zoom in 4x at that point, shift-click = zoom out
 *           [ ] = adjust max_color (switches to a fixed range),
 *           - + = halve/double iterations,
 *           c = copy "X Y DISTANCE MAX_COLOR" (for mb.py --at), esc = back
 *
 * Iterations rise automatically with zoom depth; ?iterations sets the floor.
 * Colors come from mb.py's orbit trap; when that goes flat at deep zooms,
 * they switch automatically to smooth escape time (o or ?color= forces one).
 *
 * Low resolution iterates every pixel in 64-bit floats, which runs out of
 * precision around distance 1e-13. High resolution uses perturbation theory:
 * one reference orbit at the view center is computed in arbitrary precision
 * (BigInt fixed point), and each pixel iterates only its small offset from
 * that orbit in ordinary doubles, which reaches down to about 1e-290.
 *
 * The URL tracks the current view, so reloading resumes where you left off.
 *
 * URL parameters: ?location=N ?iterations=N ?hold=SECONDS ?once
 *                 ?at=X,Y,DISTANCE[,MAX_COLOR] ?palette=NAME ?auto=0 ?hd=1
 *                 ?color=auto|trap|escape
 */

// [x, y, distance, maxColor], same as mb.py. The view's horizontal span is
// distance / 3, so framing matches the terminal version.
const LOCATIONS = [
  [-0.5, 0.0, 6.75, 256],
  [0.37865401, 0.669227668, 0.04, 111],
  [-1.2693, -0.4145, 0.2, 105],
  [-1.2693, -0.4145, 0.05, 97],
  [-1.2642, -0.4185, 0.01, 95],
  [-1.15, -0.28, 0.9, 94],
  [-1.15, -0.28, 0.3, 58],
  [-1.15, -0.28, 0.05, 26],
  [-1.401155, 0.0, 0.2, 51],          // Feigenbaum point: period-doubling cascade
  [-1.7685, 0.0, 0.2, 58],            // minibrot on the main antenna
  [-0.1011, 0.9563, 0.04, 86],        // Misiurewicz point: spiraling filaments
  [-0.660295, 0.438827, 0.1, 69],     // banded filaments off the main cardioid
  [-1.234948, 0.164974, 0.02, 26],    // just outside the period-2 bulb
  [-0.180977, 0.844923, 0.02, 36],    // edge of the period-3 bulb
  [-0.558794, 0.627494, 0.1, 61],     // tendrils between the cardioid and top bulb
  [0.393174, 0.370292, 0.02, 42],     // a bulb on the right edge of the cardioid
  [0.149181, 0.655944, 0.02, 52],     // side bulb on the upper-right shoulder
  [-0.465086, 0.625207, 0.005, 45],   // deep zoom: knotted bands
  [-0.735379, 0.290928, 0.005, 42],   // deep zoom: seahorse valley wall
  [-1.050426, 0.262645, 0.005, 30],   // deep zoom: outskirts of the period-2 bulb
  // HD only: needs continuous color and thousands of iterations, so it
  // renders as a single glyph in mb.py.
  [-1.7796274664, -0.0002364244, 0.000003052, 3],  // deep in the antenna: beaded minibrot
];

const RAMP_STEPS = 80;
const LUT_SIZE = 1024;
const BAND_ROWS = 8;

// Port of Python's colorsys.hsv_to_rgb (hue wraps around 1.0).
function hsvToRgb(h, s, v) {
  if (s === 0) return [v, v, v];
  let i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
  i %= 6;
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i];
}

// Palettes map s in [0, 1] to a color, where s = 1 is the orbit that came
// closest to the origin (the "#" glyph in mb.py, bright, hugging the set) and
// s = 0 the farthest ("." glyph, the dark background). Gradient palettes are
// lists of [position, [r, g, b]] stops; "terminal" is mb.py's HSV ramp.
const PALETTES = {
  ultra: [[0, [0, 4, 30]], [0.35, [20, 80, 180]], [0.7, [225, 245, 255]],
          [0.86, [255, 170, 0]], [1, [255, 245, 210]]],
  fire:  [[0, [0, 0, 0]], [0.3, [110, 8, 0]], [0.6, [225, 85, 0]],
          [0.85, [255, 200, 40]], [1, [255, 255, 225]]],
  ice:   [[0, [0, 2, 12]], [0.4, [8, 40, 115]], [0.75, [40, 170, 230]],
          [1, [235, 255, 255]]],
  neon:  [[0, [4, 0, 18]], [0.4, [75, 0, 135]], [0.7, [225, 30, 165]],
          [0.9, [255, 170, 220]], [1, [255, 255, 255]]],
  mono:  [[0, [0, 0, 0]], [1, [255, 255, 255]]],
  terminal: null,
};
const PALETTE_NAMES = Object.keys(PALETTES);

function buildLut(name) {
  const stops = PALETTES[name];
  const lut = new Uint8ClampedArray(LUT_SIZE * 3);
  for (let i = 0; i < LUT_SIZE; i++) {
    const s = i / (LUT_SIZE - 1);
    let rgb;
    if (!stops) {
      // mb.py's ramp; brightness stands in for glyph density.
      const u = s * (RAMP_STEPS - 1) / RAMP_STEPS;
      const k = 255 * (0.06 + 0.94 * Math.pow(s, 1.3));
      rgb = hsvToRgb(0.57 + u, 1 - u ** 3, 1).map((c) => c * k);
    } else {
      let j = 1;
      while (j < stops.length - 1 && stops[j][0] < s) j++;
      const [p0, c0] = stops[j - 1], [p1, c1] = stops[j];
      let f = (s - p0) / (p1 - p0);
      f = f * f * (3 - 2 * f);  // smoothstep between stops
      rgb = c0.map((c, k) => c + (c1[k] - c) * f);
    }
    lut.set(rgb, i * 3);
  }
  return lut;
}

// Orbit-trap value as in mb.py, left continuous for smooth gradients:
// 0 inside the set, otherwise 1..255 from the orbit's closest approach to 0.
// With `smooth`, instead the continuous escape time (iterations to reach a
// large bailout, fractional part from how far past it the orbit landed),
// which keeps varying at every zoom depth.
function orbitValue(cr, ci, iterations, smooth) {
  // Skip the main cardioid and period-2 bulb: always inside the set.
  const ci2 = ci * ci;
  const q = (cr - 0.25) * (cr - 0.25) + ci2;
  if (q * (q + (cr - 0.25)) <= 0.25 * ci2 || (cr + 1) * (cr + 1) + ci2 <= 0.0625) return 0;
  let zr = 0, zi = 0, mind2 = 4;
  const bailout = smooth ? 1e6 : 4;
  for (let i = 0; i < iterations; i++) {
    const t = zr * zr - zi * zi + cr;
    zi = 2 * zr * zi + ci;
    zr = t;
    const d2 = zr * zr + zi * zi;
    if (d2 >= bailout) {
      return smooth ? i + 5 - Math.log2(Math.log2(d2) / 2)
                    : Math.min(Math.sqrt(mind2) / 0.007, 254) + 1;
    }
    if (d2 < mind2) mind2 = d2;
  }
  return 0;
}

// The same value (orbit trap or smooth escape time) by perturbation: ref
// holds the reference orbit Z_0..Z_{refLen-1} (interleaved re, im) of the
// view center, and (dcr, dci) is this pixel's offset from the center.
// Iterates dz, where z = Z_m + dz:
//   dz' = 2 Z_m dz + dz^2 + dc
// When z gets closer to 0 than dz (where dz would lose precision), or the
// reference runs out (it escaped, or is shorter than needed), the orbit is
// rebased onto the start of the reference: dz = z, m = 0. That keeps the
// deltas accurate without any glitch detection.
function perturbValue(dcr, dci, ref, refLen, iterations, smooth) {
  let dzr = 0, dzi = 0, m = 0, mind2 = 4;
  const bailout = smooth ? 1e6 : 4;
  for (let i = 0; i < iterations; i++) {
    const Zr = ref[2 * m], Zi = ref[2 * m + 1];
    const t = 2 * (Zr * dzr - Zi * dzi) + dzr * dzr - dzi * dzi + dcr;
    dzi = 2 * (Zr * dzi + Zi * dzr + dzr * dzi) + dci;
    dzr = t;
    m++;
    const zr = ref[2 * m] + dzr, zi = ref[2 * m + 1] + dzi;
    const d2 = zr * zr + zi * zi;
    if (d2 >= bailout) {
      return smooth ? i + 5 - Math.log2(Math.log2(d2) / 2)
                    : Math.min(Math.sqrt(mind2) / 0.007, 254) + 1;
    }
    if (d2 < mind2) mind2 = d2;
    if (d2 < dzr * dzr + dzi * dzi || m === refLen - 1) {
      dzr = zr; dzi = zi; m = 0;
    }
  }
  return 0;
}

// Renders a band of rows to RGBA, mapping values in [lo, hi] across the
// palette. Shipped to the workers via toString() along with orbitValue and
// perturbValue, so it must not reference anything else. In high-resolution
// jobs (job.hd), xmin/ymin are offsets from the reference orbit's center.
// Orbit-trap values are brightest near the set (small values); smooth escape
// times are brightest near the set too, but there that means large values.
function renderBand(job, lut, ref) {
  const { width, y0, rows, xmin, ymin, step, iterations, lo, hi, quantiles, hd, smooth } = job;
  const refLen = ref ? ref.length >> 1 : 0;
  const qn = quantiles ? quantiles.length - 1 : 0;
  const out = new Uint8ClampedArray(width * rows * 4);
  const top = lut.length / 3 - 1;
  const span = Math.max(hi - lo, 1e-9);
  let o = 0;
  for (let r = 0; r < rows; r++) {
    const ci = ymin + (y0 + r) * step;
    for (let ix = 0; ix < width; ix++, o += 4) {
      out[o + 3] = 255;
      const value = hd
        ? perturbValue(xmin + ix * step, ci, ref, refLen, iterations, smooth)
        : orbitValue(xmin + ix * step, ci, iterations, smooth);
      if (value === 0) continue;  // inside the set: black
      let rank;
      if (quantiles) {
        // Histogram equalization: rank of this value among on-screen samples.
        let a = 0, b = qn;
        if (value <= quantiles[0]) rank = 0;
        else if (value >= quantiles[qn]) rank = 1;
        else {
          while (b - a > 1) { const m = (a + b) >> 1; if (quantiles[m] <= value) a = m; else b = m; }
          const gap = quantiles[b] - quantiles[a];
          rank = (a + (gap > 0 ? (value - quantiles[a]) / gap : 0)) / qn;
        }
      } else {
        rank = Math.min(Math.max((value - lo) / span, 0), 1);
      }
      const s = smooth ? rank : 1 - rank;
      const li = Math.round(s * top) * 3;
      out[o] = lut[li];
      out[o + 1] = lut[li + 1];
      out[o + 2] = lut[li + 2];
    }
  }
  return out;
}

function savedPalette() {
  const fromUrl = new URLSearchParams(window.location.search).get("palette");
  let stored = null;
  try { stored = localStorage.getItem("mb-palette"); } catch (err) { /* file:// or private mode */ }
  return [fromUrl, stored].find((p) => p in PALETTES) || "ultra";
}
let palette = savedPalette();
let LUT = buildLut(palette);

// --- workers ------------------------------------------------------------------

const WORKER_SRC = `${orbitValue.toString()}
${perturbValue.toString()}
${renderBand.toString()}
let lut = null, ref = null;
onmessage = (e) => {
  const d = e.data;
  if (d.lut) { lut = d.lut; return; }
  if (d.ref) { ref = d.ref; return; }
  const out = renderBand(d.job, lut, ref);
  postMessage({ gen: d.gen, y0: d.job.y0, rows: d.job.rows, out }, [out.buffer]);
};`;

let workers = [];
try {
  const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
  const count = Math.max(1, Math.min(navigator.hardwareConcurrency || 4, 12));
  for (let k = 0; k < count; k++) {
    const w = new Worker(url);
    w.postMessage({ lut: LUT });
    // If workers can't run here, fall back to the main thread once.
    w.addEventListener("error", () => {
      if (!workers.length) return;
      workers.forEach((x) => x.terminate());
      workers = [];
      show(view);
    }, { once: true });
    workers.push(w);
  }
} catch (err) {
  workers = [];  // fall back to rendering on the main thread
}

// --- big numbers ------------------------------------------------------------------

// Fixed-point values { m, e } meaning m * 2^-e (m a BigInt), for view centers
// and the reference orbit, which need more precision than doubles carry.

// m * 2^-s, rounded (s may be negative).
function shr(m, s) {
  if (s <= 0) return m << BigInt(-s);
  return (m + (1n << BigInt(s - 1))) >> BigInt(s);
}

const rescale = (a, e) => ({ m: shr(a.m, a.e - e), e });

function bigAdd(a, b) {
  const e = Math.max(a.e, b.e);
  return { m: rescale(a, e).m + rescale(b, e).m, e };
}

// Exact: every double is a dyadic rational.
function bigFromDouble(v, e) {
  const view = new DataView(new ArrayBuffer(8));
  view.setFloat64(0, v);
  const bits = view.getBigUint64(0);
  const biased = Number((bits >> 52n) & 0x7ffn);
  let mant = bits & ((1n << 52n) - 1n);
  if (biased) mant |= 1n << 52n;
  // v = mant * 2^(exponent - 1075)
  const m = shr(mant, 1075 - Math.max(biased, 1) - e);
  return { m: bits >> 63n ? -m : m, e };
}

// Parses decimal text such as "-1.77962746640001" or "3.05e-6" without
// rounding through a double first. Returns null if it isn't a number.
function bigFromString(text, e) {
  const match = /^\s*([+-]?)(\d*)(?:\.(\d*))?(?:e([+-]?\d+))?\s*$/i.exec(text);
  if (!match || !(match[2] + (match[3] || ""))) return null;
  const digits = BigInt(match[2] + (match[3] || ""));
  const exp10 = parseInt(match[4] || "0", 10) - (match[3] || "").length;
  let m;
  if (exp10 >= 0) {
    m = (digits * 10n ** BigInt(exp10)) << BigInt(e);
  } else {
    const den = 10n ** BigInt(-exp10);
    m = ((digits << BigInt(e + 1)) + den) / (2n * den);  // rounded
  }
  return { m: match[1] === "-" ? -m : m, e };
}

function bigToDouble(a) {
  // Number() rounds correctly but overflows past 2^1024, so shift first.
  // Fast path for values near 1 (the reference orbit); tiny values keep 64
  // significant bits instead.
  let s = Math.max(0, a.e - 1000);
  let x = Number(shr(a.m, s));
  if (s > 0 && Math.abs(x) < 2 ** 64) {
    const bits = (a.m < 0n ? -a.m : a.m).toString(16).length * 4;
    s = Math.max(0, bits - 64);
    x = Number(shr(a.m, s));
  }
  const p = s - a.e;  // split the scaling so 2^p can't underflow on its own
  return x * 2 ** Math.ceil(p / 2) * 2 ** Math.floor(p / 2);
}

// Decimal text with `digits` places, trailing zeros trimmed.
function bigToString(a, digits) {
  const neg = a.m < 0n;
  const scaled = shr((neg ? -a.m : a.m) * 10n ** BigInt(digits), a.e);
  const s = scaled.toString().padStart(digits + 1, "0");
  const frac = s.slice(-digits).replace(/0+$/, "");
  const text = s.slice(0, -digits) + (frac ? "." + frac : "");
  return neg && scaled !== 0n ? "-" + text : text;
}

// Fractional bits for a view with this pixel step: enough to place the
// center well below one pixel, with headroom for the reference orbit.
const precisionFor = (step) => Math.max(64, Math.ceil(-Math.log2(step)) + 64);

// Reference orbit Z_0 = 0, Z_{n+1} = Z_n^2 + C in fixed point, stored as
// doubles. Extended on demand, stopping early once it escapes.
function makeReference(cx, cy) {
  return { cx: cx.m, cy: cy.m, e: cx.e, zx: 0n, zy: 0n, len: 1, escaped: false,
           data: new Float64Array(2 * 1024) };
}

function extendReference(ref, iters) {
  if (ref.escaped || ref.len > iters) return;
  const E = BigInt(ref.e), E1 = E - 1n, { cx, cy, e } = ref;
  let { zx, zy, len, data } = ref;
  if (data.length < 2 * (iters + 1)) {
    const grown = new Float64Array(2 * (iters + 1));
    grown.set(data.subarray(0, 2 * len));
    data = grown;
  }
  while (len <= iters) {
    const nx = ((zx * zx - zy * zy) >> E) + cx;
    zy = ((zx * zy) >> E1) + cy;
    zx = nx;
    const r = bigToDouble({ m: zx, e }), i = bigToDouble({ m: zy, e });
    data[2 * len] = r;
    data[2 * len + 1] = i;
    len++;
    if (r * r + i * i > 4) { ref.escaped = true; break; }
  }
  Object.assign(ref, { zx, zy, len, data });
}

// --- page -----------------------------------------------------------------------

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

const params = new URLSearchParams(window.location.search);
const num = (key, fallback) => {
  const v = parseFloat(params.get(key));
  return Number.isFinite(v) ? v : fallback;
};

let locations = LOCATIONS;
let once = params.has("once");
const atText = (params.get("at") || "").split(",");
const at = atText.map(Number);
let centers = LOCATIONS.map(([x, y]) => ({ x: bigFromDouble(x, 64), y: bigFromDouble(y, 64) }));
if (at.length >= 3 && at.length <= 4 && at.every(Number.isFinite)) {
  locations = [[at[0], at[1], at[2], at[3] || 256]];
  // Keep every digit given: ?at= may be deeper than doubles can represent.
  const bits = precisionFor(at[2] / 3 / 8192);
  const exact = (k) => bigFromString(atText[k], bits) || bigFromDouble(at[k], bits);
  centers = [{ x: exact(0), y: exact(1) }];
  once = true;
}
const n = locations.length;
const hold = Math.max(0, num("hold", 5)) * 1000;
let iterations = Math.max(1, Math.floor(num("iterations", 500)));
let current = ((Math.floor(num("location", 0)) % n) + n) % n;
let view = locations[current].slice();
let center = centers[current];  // exact view center; view[0..1] round it to doubles
let hiRes = params.get("hd") === "1";  // perturbation rendering
let reference = null;           // reference orbit for the current hi-res view
let mode = "tour";            // "tour" or "explore"
let paused = false;
let holdTimer = 0, hudTimer = 0;
let gen = 0, cancel = null, geometry = null, rendered = false;
let autoRange = params.get("auto") !== "0";  // stretch colors to what's on screen
const COLOR_MODES = ["auto", "trap", "escape"];  // orbit trap, escape time, or pick
let colorMode = COLOR_MODES.includes(params.get("color")) ? params.get("color") : "auto";
let range = null;                            // { lo, hi } used by the last render
let effectiveIterations = iterations;

const nextFrame = () => new Promise((r) => requestAnimationFrame(r));

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
}

// Deeper zooms need more iterations to resolve detail near the set.
let iterationScale = 1;  // adjusted with - and +
const iterationsFor = (distance) =>
  Math.round(Math.max(iterations, 200 * Math.log10(6.75 / distance)));

// Orbit values on a coarse grid of about `count` points across the view
// (0 for points that never escaped).
function sampleView(width, height, iters, count, smooth = false) {
  const k = Math.max(1, Math.ceil(Math.sqrt((width * height) / count)));
  const { xmin, ymin, step, hd } = geometry;
  if (hd) extendReference(reference, iters);
  const values = [];
  for (let py = k >> 1; py < height; py += k) {
    for (let px = k >> 1; px < width; px += k) {
      const cr = xmin + px * step, ci = ymin + py * step;
      values.push(hd
        ? perturbValue(cr, ci, reference.data, reference.len, iters, smooth)
        : orbitValue(cr, ci, iters, smooth));
    }
  }
  return values;
}

// Some regions (the antenna especially) escape far more slowly than zoom
// depth suggests. Keep doubling iterations while that still turns a
// meaningful share of "inside" samples into escaped ones.
function adaptIterations(width, height, iters) {
  const stuck = (it) => sampleView(width, height, it, 4000).filter((v) => v === 0).length / 4000;
  let current = stuck(iters);
  while (iters < (1 << 16) && current > 0.002) {
    const next = stuck(iters * 2);
    if (current - next < 0.005) break;
    iters *= 2;
    current = next;
  }
  return iters;
}

// How values map onto the palette. Auto mode equalizes: colors are assigned by
// rank among on-screen samples, so the whole palette is used even when the
// values bunch up. Otherwise it reproduces mb.py's (value + 1) / max_color.
// lo/hi (1st-98th percentile) are kept for the max_color shown and copied.
//
// Deep in, the orbit trap stops working: it's set within the first few
// iterations, where neighboring pixels' orbits are identical in doubles, so
// many pixels get exactly the same value. When repeats show up on screen
// (normal views have essentially none), switch to (equalized) smooth escape
// time, which doesn't.
function colorRange(width, height, iters, maxColor) {
  const equalize = (values) => {
    if (values.length < 50) return null;
    values.sort((a, b) => a - b);
    const lo = values[Math.floor(values.length * 0.01)];
    const hi = values[Math.floor(values.length * 0.98)];
    const quantiles = Array.from({ length: 257 }, (_, i) =>
      values[Math.floor((i / 256) * (values.length - 1))]);
    return { lo, hi: Math.max(hi, lo + 1), quantiles, smooth: false };
  };
  const escape = () => {
    const r = equalize(sampleView(width, height, iters, 20000, true).filter((v) => v));
    return r && { ...r, smooth: true };
  };
  if (colorMode === "escape") {
    const r = escape();
    if (r) return r;
  }
  const samples = sampleView(width, height, iters, 20000).filter((v) => v);
  const repeats = 1 - new Set(samples).size / samples.length;
  const trap = equalize(samples);
  if (colorMode === "auto" && trap && repeats > 0.05) {
    const r = escape();
    if (r) return r;
  }
  if (autoRange && trap) return trap;
  return { lo: -1, hi: maxColor - 1, quantiles: null, smooth: false };
}
// Renders a view progressively. Resolves true when complete, false if a
// newer render superseded it.
function render([x, y, distance, maxColor]) {
  if (cancel) cancel(false);
  const my = ++gen;
  const width = canvas.width, height = canvas.height;
  const step = distance / 3 / width;
  if (hiRes) {
    // Pixels are offsets from the exact center, whose orbit is the reference.
    const e = precisionFor(step);
    const cx = rescale(center.x, e), cy = rescale(center.y, e);
    if (!reference || reference.cx !== cx.m || reference.cy !== cy.m || reference.e !== e) {
      reference = makeReference(cx, cy);
    }
    geometry = { xmin: -(step * width) / 2, ymin: -(step * height) / 2, step, hd: true };
  } else {
    geometry = { xmin: x - (step * width) / 2, ymin: y - (step * height) / 2, step, hd: false };
  }
  const iters = effectiveIterations = Math.min(1 << 16, Math.max(50, Math.round(
    adaptIterations(width, height, iterationsFor(distance)) * iterationScale)));
  range = colorRange(width, height, iters, maxColor);
  let ref = null;
  if (hiRes) {
    extendReference(reference, iters);
    ref = reference.data.slice(0, 2 * reference.len);
    workers.forEach((w) => w.postMessage({ ref }));
  }
  const jobs = [];
  for (let y0 = 0; y0 < height; y0 += BAND_ROWS) {
    jobs.push({ width, y0, rows: Math.min(BAND_ROWS, height - y0), ...geometry, iterations: iters, ...range });
  }
  const draw = (y0, rows, out) => ctx.putImageData(new ImageData(out, width, rows), 0, y0);

  return new Promise((resolve) => {
    cancel = resolve;
    let next = 0, done = 0;
    const complete = () => {
      if (++done === jobs.length && gen === my) { cancel = null; resolve(true); }
    };
    if (workers.length) {
      const feed = (w) => { if (gen === my && next < jobs.length) w.postMessage({ gen: my, job: jobs[next++] }); };
      for (const w of workers) {
        w.onmessage = (e) => {
          const d = e.data;
          if (d.gen !== my) return;
          draw(d.y0, d.rows, d.out);
          complete();
          feed(w);
        };
        feed(w);
      }
    } else {
      (async () => {
        for (const job of jobs) {
          if (gen !== my) return;
          draw(job.y0, job.rows, renderBand(job, LUT, ref));
          complete();
          if (job.y0 % (BAND_ROWS * 8) === 0) await nextFrame();
        }
      })();
    }
  });
}

// Enough decimal places to place the view to well under a pixel.
function fmt(v, distance) {
  return bigToString(v, Math.max(4, Math.ceil(-Math.log10(distance)) + 4));
}

// max_color for mb.py: in auto mode, the top of the measured range.
const currentMaxColor = () =>
  Math.round(autoRange && range && !range.smooth ? range.hi + 1 : view[3]);

function coords() {
  const distance = view[2];
  return `${fmt(center.x, distance)} ${fmt(center.y, distance)} ${parseFloat(distance.toPrecision(4))} ${currentMaxColor()}`;
}

function colorInfo() {
  const coloring = range && range.smooth
    ? "escape time" : `orbit trap (${autoRange ? "auto" : "fixed"} range)`;
  return `${palette}, ${colorMode} color: ${coloring}, ${hiRes ? "hi-res" : "lo-res"}`;
}

function showHud(text, sticky = false) {
  hud.textContent = text;
  hud.classList.add("show");
  clearTimeout(hudTimer);
  if (!sticky) hudTimer = setTimeout(() => hud.classList.remove("show"), 3000);
}

function updateHud(extra = "") {
  if (mode === "explore") {
    showHud(`${coords()}   iterations ${effectiveIterations}   ${colorInfo()}${extra}\n` +
            "click: in  shift-click: out  p: palette  a: auto color  [ ]: color range\n" +
            "- +: iterations  h: hi-res  o: coloring  c: copy  esc: back", true);
  } else {
    const [x, y, distance] = view;
    showHud(`${current + 1}/${n}  ${x}, ${y}  distance ${distance}   ${colorInfo()}` +
            `${paused ? "  (paused)" : ""}${extra}`, paused);
  }
}

// Mirrors the current view into the URL, so reloading picks up from here.
function saveState() {
  const q = new URLSearchParams(window.location.search);
  if (mode === "explore") {
    q.set("at", coords().split(" ").join(","));
    q.delete("location");
  } else if (locations === LOCATIONS) {
    q.set("location", String(current));
    q.delete("at");
  }
  if (hiRes) q.set("hd", "1"); else q.delete("hd");
  if (autoRange) q.delete("auto"); else q.set("auto", "0");
  if (colorMode === "auto") q.delete("color"); else q.set("color", colorMode);
  if (q.has("palette")) q.set("palette", palette);
  const text = q.toString().replace(/%2C/g, ",");
  try {
    history.replaceState(null, "", text ? `?${text}` : window.location.pathname);
  } catch (err) { /* some file:// setups refuse */ }
}

async function show(v) {
  clearTimeout(holdTimer);
  view = v;
  rendered = false;
  const done = render(view);  // sets up range synchronously, used by coords()
  saveState();
  const ok = await done;
  if (!ok) return;
  rendered = true;
  scheduleAdvance();
}

function scheduleAdvance() {
  clearTimeout(holdTimer);
  if (mode === "tour" && !paused && !once && rendered) {
    holdTimer = setTimeout(() => go(1), hold);
  }
}

function go(delta) {
  mode = "tour";
  current = (((current + delta) % n) + n) % n;
  center = centers[current];
  show(locations[current].slice());
  updateHud();
}

function zoom(e, factor) {
  if (!geometry) return;
  const px = (e.offsetX * canvas.width) / canvas.clientWidth;
  const py = (e.offsetY * canvas.height) / canvas.clientHeight;
  // Offset of the clicked point from the view center.
  const dx = (px - canvas.width / 2) * geometry.step;
  const dy = (py - canvas.height / 2) * geometry.step;
  mode = "explore";
  const distance = view[2] * factor;
  if (distance < minDistance(view[0] + dx, view[1] + dy)) {
    updateHud(hiRes
      ? "\nmax zoom: pixel offsets would underflow 64-bit floats"
      : "\nmax zoom: 64-bit floats can't resolve any deeper here (h: hi-res)");
    return;
  }
  // Move the exact center in both modes, so switching later keeps the point.
  const bits = precisionFor(distance / 3 / canvas.width);
  center = {
    x: bigAdd(rescale(center.x, bits), bigFromDouble(dx, bits)),
    y: bigAdd(rescale(center.y, bits), bigFromDouble(dy, bits)),
  };
  show([bigToDouble(center.x), bigToDouble(center.y), distance, view[3]]);
  updateHud();
}

// Smallest view distance that still renders sharply. In low resolution, any
// deeper and neighboring pixels round to the same 64-bit float, so the image
// turns into blocks (with headroom for rounding error that builds up during
// iteration). In high resolution only the per-pixel offsets are doubles, so
// the limit is where they would underflow.
function minDistance(x, y) {
  if (hiRes) return 1e-290;
  const minStep = 8 * Number.EPSILON * Math.max(Math.abs(x), Math.abs(y), 1);
  return 3 * canvas.width * minStep;
}

canvas.addEventListener("click", (e) => zoom(e, e.shiftKey ? 4 : 0.25));

document.addEventListener("keydown", (e) => {
  switch (e.key) {
    case " ":
      e.preventDefault();
      if (mode === "explore") { go(0); break; }
      paused = !paused;
      scheduleAdvance();
      updateHud();
      break;
    case "n": case "ArrowRight": go(1); break;
    case "ArrowLeft": go(-1); break;
    case "Escape": if (mode === "explore") go(0); break;
    case "[": case "]":
      if (mode !== "explore") break;
      // Manual adjustment starts from whatever range is on screen now.
      view[3] = Math.max(2, currentMaxColor() * (e.key === "]" ? 1.25 : 0.8));
      autoRange = false;
      show(view); updateHud(); break;
    case "o":
      colorMode = COLOR_MODES[(COLOR_MODES.indexOf(colorMode) + 1) % COLOR_MODES.length];
      show(view); updateHud(); break;
    case "a":
      autoRange = !autoRange;
      show(view); updateHud(); break;
    case "h":
      hiRes = !hiRes;
      show(view); updateHud(); break;
    case "p": {
      palette = PALETTE_NAMES[(PALETTE_NAMES.indexOf(palette) + 1) % PALETTE_NAMES.length];
      LUT = buildLut(palette);
      workers.forEach((w) => w.postMessage({ lut: LUT }));
      try { localStorage.setItem("mb-palette", palette); } catch (err) { /* ignore */ }
      show(view); updateHud(); break;
    }
    case "-": case "+": case "=":
      if (mode !== "explore") break;
      iterationScale *= e.key === "-" ? 0.5 : 2;
      show(view); updateHud(); break;
    case "c":
      if (mode !== "explore") break;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(coords()).then(
          () => updateHud("   copied"), () => updateHud("   copy failed"));
      }
      break;
  }
});

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resize(); show(view); }, 200);
});

resize();
show(view);
showHud(`${current + 1}/${n}   click: zoom in  space: pause  n: next  p: palette  a: auto color  h: hi-res  o: coloring`);
</script>
</body>
</html>
