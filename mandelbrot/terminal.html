<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mandelbrot</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #screen {
    box-sizing: border-box;
    height: 100%;
    margin: 0;
    padding: 0 2px;
    font: 14px/1.15 ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    white-space: pre;
    overflow: hidden;
    cursor: pointer;
  }
  #screen div { height: 1.15em; }
  #hud {
    position: fixed;
    right: 12px;
    bottom: 10px;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.7);
    color: #888;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  #hud.show { opacity: 1; transition: none; }
</style>
</head>
<body>
<pre id="screen" aria-label="Animated ASCII rendering of the Mandelbrot set"></pre>
<div id="hud"></div>
<script>
"use strict";
/*
 * Browser port of mb.py: draws the Mandelbrot set as colored ASCII, one
 * screen per location, row by row, cycling through a list of locations.
 *
 * Keys: space = pause, n / right arrow = next location, left arrow = previous.
 * Click or tap = next location.
 *
 * URL parameters mirror the CLI flags, plus hold:
 *   ?location=N  ?speed=F  ?iterations=N  ?once  ?at=X,Y,DISTANCE[,MAX_COLOR]
 *   ?hold=SECONDS  how long a finished screen stays up (default 5)
 */

// --- core (kept in step with mb.py) -----------------------------------------

// [x, y, distance, maxColor]: lower distance zooms in; maxColor stretches
// the color/glyph ramp to suit how deep each view's orbits get.
const LOCATIONS = [
  [-0.5, 0.0, 6.75, 256],
  [0.37865401, 0.669227668, 0.04, 111],
  [-1.2693, -0.4145, 0.2, 105],
  [-1.2693, -0.4145, 0.05, 97],
  [-1.2642, -0.4185, 0.01, 95],
  [-1.15, -0.28, 0.9, 94],
  [-1.15, -0.28, 0.3, 58],
  [-1.15, -0.28, 0.05, 26],
  [-1.401155, 0.0, 0.2, 51],          // Feigenbaum point: period-doubling cascade
  [-1.7685, 0.0, 0.2, 58],            // minibrot on the main antenna
  [-0.1011, 0.9563, 0.04, 86],        // Misiurewicz point: spiraling filaments
  [-0.660295, 0.438827, 0.1, 69],     // banded filaments off the main cardioid
  [-1.234948, 0.164974, 0.02, 26],    // just outside the period-2 bulb
  [-0.180977, 0.844923, 0.02, 36],    // edge of the period-3 bulb
  [-0.558794, 0.627494, 0.1, 61],     // tendrils between the cardioid and top bulb
  [0.393174, 0.370292, 0.02, 42],     // a bulb on the right edge of the cardioid
  [0.149181, 0.655944, 0.02, 52],     // side bulb on the upper-right shoulder
  [-0.465086, 0.625207, 0.005, 45],   // deep zoom: knotted bands
  [-0.735379, 0.290928, 0.005, 42],   // deep zoom: seahorse valley wall
  [-1.050426, 0.262645, 0.005, 30],   // deep zoom: outskirts of the period-2 bulb
];

const GLYPHS = [".", ".", "+", "*", "%", "#"];
const ASPECT_RATIO = 1 / 3;   // compensates for tall character cells
const RAMP_STEPS = 80;

// Port of Python's colorsys.hsv_to_rgb (hue wraps around 1.0).
function hsvToRgb(h, s, v) {
  if (s === 0) return [v, v, v];
  let i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
  i %= 6;
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i];
}

// Same HSV curve as mb.py's truecolor palette.
const PALETTE = Array.from({ length: 256 }, (_, i) => {
  const u = (i / 256) * (RAMP_STEPS - 1) / RAMP_STEPS;
  const [r, g, b] = hsvToRgb(0.57 + u, 1 - u ** 3, 1);
  return `rgb(${Math.floor(r * 255)},${Math.floor(g * 255)},${Math.floor(b * 255)})`;
});

// 0 = inside the set; otherwise 1..255 from the orbit's closest approach to 0.
function pixel(cr, ci, iterations) {
  let zr = 0, zi = 0, mind = 2;
  for (let i = 0; i < iterations; i++) {
    const t = zr * zr - zi * zi + cr;
    zi = 2 * zr * zi + ci;
    zr = t;
    const d = Math.sqrt(zr * zr + zi * zi);
    if (d >= 2) return Math.min(Math.floor(mind / 0.007), 254) + 1;
    if (d < mind) mind = d;
  }
  return 0;
}

// Yields one row at a time as an array of [glyph, color] cells. The scale
// matches mb.py (horizontal span = distance / 3); height just crops or
// extends the view vertically around the center.
function* frameRows([x, y, distance, maxColor], width, height, iterations, invert = true) {
  const yscale = distance / width;
  const xscale = yscale * ASPECT_RATIO;
  const xmin = x - (xscale * width) / 2;
  const ymin = y - (yscale * height) / 2;
  for (let iy = 0; iy < height; iy++) {
    const ci = ymin + yscale * iy;
    const row = new Array(width);
    for (let ix = 0; ix < width; ix++) {
      const value = pixel(xmin + xscale * ix, ci, iterations);
      let t = Math.min((value + 1) / maxColor, 1);
      if (invert) t = 1 - t;
      row[ix] = [
        GLYPHS[Math.min(Math.floor(t * (GLYPHS.length - 1)), GLYPHS.length - 1)],
        PALETTE[Math.min(Math.floor(t * (PALETTE.length - 1)), PALETTE.length - 1)],
      ];
    }
    yield row;
  }
}

// --- page --------------------------------------------------------------------

if (typeof document !== "undefined") {
  const params = new URLSearchParams(window.location.search);
  const num = (key, fallback) => {
    const v = parseFloat(params.get(key));
    return Number.isFinite(v) ? v : fallback;
  };
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let locations = LOCATIONS;
  let once = params.has("once");
  const at = (params.get("at") || "").split(",").map(Number);
  if (at.length >= 3 && at.length <= 4 && at.every(Number.isFinite)) {
    locations = [[at[0], at[1], at[2], at[3] || 256]];
    once = true;
  }
  const speed = Math.max(0, num("speed", reducedMotion ? 0 : 1));
  const iterations = Math.max(1, Math.floor(num("iterations", 170)));
  const hold = Math.max(0, num("hold", 5)) * 1000;  // ms to show a finished screen
  const n = locations.length;
  let current = ((Math.floor(num("location", 0)) % n) + n) % n;

  const screen = document.getElementById("screen");
  const hud = document.getElementById("hud");
  let paused = false, jump = 0, resized = false, hudTimer = 0;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const nextFrame = () => new Promise((r) => requestAnimationFrame(r));

  function measure() {
    const probe = document.createElement("div");
    probe.textContent = "#".repeat(100);
    probe.style.cssText = "position:absolute;visibility:hidden";
    screen.appendChild(probe);
    const rect = probe.getBoundingClientRect();
    probe.remove();
    return { charWidth: rect.width / 100, lineHeight: rect.height };
  }

  let metrics = measure();
  const columns = () =>
    Math.max(20, Math.floor((screen.clientWidth - 4) / metrics.charWidth));
  const rows = () => Math.max(1, Math.floor(screen.clientHeight / metrics.lineHeight));

  // One div per screen row; each frame overwrites them top to bottom.
  function grid(height) {
    while (screen.childElementCount > height) screen.lastElementChild.remove();
    while (screen.childElementCount < height) screen.appendChild(document.createElement("div"));
    return Array.from(screen.children);
  }

  function appendCells(line, cells) {
    let i = 0;
    while (i < cells.length) {
      const color = cells[i][1];
      let text = "";
      while (i < cells.length && cells[i][1] === color) text += cells[i++][0];
      const span = document.createElement("span");
      span.style.color = color;
      span.textContent = text;
      line.appendChild(span);
    }
  }

  function showHud(text, sticky = false) {
    hud.textContent = text;
    hud.classList.add("show");
    clearTimeout(hudTimer);
    if (!sticky) hudTimer = setTimeout(() => hud.classList.remove("show"), 2500);
  }

  function describe(index) {
    const [x, y, distance] = locations[index];
    return `${index + 1}/${n}  ${x}, ${y}  span ${distance}`;
  }

  function interrupted() {
    if (resized) { resized = false; return "resized"; }
    if (jump) return "jump";
    return null;
  }

  // Draws one location to fill the screen, then holds it.
  // Returns "done", "resized", or "jump".
  async function drawFrame(loc) {
    const width = columns();
    const height = rows();
    const lines = grid(height);
    let iy = 0;
    for (const row of frameRows(loc, width, height, iterations)) {
      while (paused) await sleep(100);
      const stop = interrupted();
      if (stop) return stop;

      // Type the row out over a few animation frames, like the terminal does.
      const line = lines[iy++];
      line.replaceChildren();
      const steps = speed > 0 ? Math.max(1, Math.round(6 * speed)) : 1;
      const chunk = Math.ceil(width / steps);
      for (let start = 0; start < width; start += chunk) {
        appendCells(line, row.slice(start, start + chunk));
        await nextFrame();
      }
      if (speed > 0) await sleep(Math.random() * 100 * speed);
    }
    if (once) return "done";
    // Hold the finished screen before moving on.
    for (let waited = 0; waited < hold || paused; waited += 100) {
      await sleep(100);
      const stop = interrupted();
      if (stop) return stop;
    }
    return "done";
  }

  async function run() {
    showHud(describe(current) + "   space: pause  n: next");
    for (;;) {
      const result = await drawFrame(locations[current]);
      if (result === "resized") continue;
      if (result === "jump") {
        current = (((current + jump) % n) + n) % n;
        jump = 0;
      } else {
        if (once) return;
        current = (current + 1) % n;
      }
      showHud(describe(current));
    }
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === " ") {
      paused = !paused;
      paused ? showHud("paused", true) : showHud(describe(current));
      e.preventDefault();
    } else if (e.key === "n" || e.key === "ArrowRight") {
      jump = 1;
    } else if (e.key === "ArrowLeft") {
      jump = -1;
    }
  });
  screen.addEventListener("click", () => { jump = 1; });

  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { metrics = measure(); resized = true; }, 200);
  });

  run();
}
</script>
</body>
</html>
