<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mandelbrot</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    cursor: zoom-in;
    touch-action: none;
  }
  #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #stage canvas[hidden] { display: none; }
  #hud {
    position: fixed;
    right: 12px;
    bottom: 10px;
    padding: 4px 8px;
    background: rgba(0, 0, 0, 0.85);
    color: #bbb;
    border-radius: 3px;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    max-width: calc(100vw - 24px);
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  #hud.show { opacity: 1; transition: none; }
  /* Narrow screens: the tour buttons take the bottom edge. */
  @media (max-width: 640px) {
    #hud { top: 10px; bottom: auto; left: 12px; right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { #hud { transition: none; } }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Animated rendering of the Mandelbrot set">
  <canvas id="gl" hidden></canvas>
  <canvas id="cpu"></canvas>
</div>
<div id="hud"></div>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script src="core.js"></script>
<script src="cpu.js"></script>
<script src="gpu.js"></script>
<script src="camera.js"></script>
<script src="settings.js"></script>
<script>
"use strict";
/*
 * High-definition canvas port of mb.py. Same locations and color curve,
 * rendered per pixel on the GPU or in background workers, cycling through
 * the tour.
 *
 * Tour:     stops play in random order, reshuffled each time round;
 *           space = pause, n / right arrow = next, left arrow = previous,
 *           r = reset to the start of the built-in tour
 * Anywhere: p = next palette (remembered), a = toggle auto color range,
 *           h = toggle high-resolution (perturbation) mode,
 *           o = coloring: auto -> orbit trap -> escape time
 * Explore:  click = zoom in 4x at that point, shift-click = zoom out
 *           [ ] = adjust max_color (switches to a fixed range),
 *           - + = halve/double iterations,
 *           c = copy "X Y DISTANCE MAX_COLOR" (for mb.py --at), esc = back
 *
 * Iterations rise automatically with zoom depth; ?iterations sets the floor.
 * Colors come from mb.py's orbit trap; when that goes flat at deep zooms,
 * they switch automatically to smooth escape time (o or ?color= forces one).
 *
 * Low resolution iterates every pixel in 64-bit floats, which runs out of
 * precision around distance 1e-13. High resolution uses perturbation theory:
 * one reference orbit at the view center is computed in arbitrary precision
 * (BigInt fixed point), and each pixel iterates only its small offset from
 * that orbit in ordinary doubles, which reaches down to about 1e-290.
 *
 * The URL tracks the current view, so reloading resumes where you left off.
 *
 * URL parameters: ?location=N ?iterations=N ?hold=SECONDS ?once
 *                 ?at=X,Y,DISTANCE[,MAX_COLOR] ?palette=NAME ?auto=0 ?hd=1
 *                 ?color=auto|trap|escape
 */
/*
 * Code layout. Classic scripts share one global scope; each file defines one
 * global object and touches nothing else at load time (everything starts
 * from init(), called at the bottom of this page):
 *   core.js      pure math, no DOM: LOCATIONS, palettes, orbitValue(s),
 *                perturbValue, renderBand, big numbers, reference orbits,
 *                refWorker (reference orbits off the main thread)
 *   cpu.js       cpuRenderer   gpu.js     gpuRenderer
 *   camera.js    camera        settings.js settings
 *   this page    state, setters, HUD, URL sync, keys, tour
 *
 * Renderer { name, available, canvas, init(), resize(w, h), setPalette(lut),
 *            setTarget(t), frame(cam), status(), minDistance(x, y), stop() }
 *   t   = { center: { x, y } (big), distance, maxColor, final, force }
 *         The view to render. final = false is a draft while the camera
 *         moves (the GPU renders it at reduced quality, the CPU ignores it);
 *         final = true is the full-quality settled view. Repeating the same
 *         target is a no-op unless force (settings changed).
 *   cam = { center: { x, y } (big), distance }
 *         What is on screen this frame. frame(cam) is called on every
 *         animation frame: it draws the latest image(s) reprojected to cam
 *         and advances pending work within a frame budget.
 *   status() -> { done, range, effectiveIterations }
 *         done: the last final target is fully rendered. range: colorRange()
 *         result used ({ lo, hi, quantiles, smooth }), for the HUD.
 *   stop()   abandon pending work (the renderer is being switched away);
 *            the next final setTarget starts fresh.
 *   Settings come from page globals, read at render time: iterations,
 *   iterationScale, hiRes (CPU only), colorMode, autoRange, LUT, palette.
 *   iterationsFor(distance) gives the base iteration count.
 *
 * camera { cam, target, init(), jumpTo(t), animateTo(t, how), refresh(),
 *          onRendered }
 *   how = "zoom" (eased click zoom) or "dive" (tour transition).
 *   Pointer input lives in camera.js: click calls zoom(x, y, factor) here;
 *   wheel/pinch/drag move the camera itself and report the new view with
 *   moveTo(center, distance).
 *
 * Shared preferences: anim = { clickMs, dive, diveMs } and hold (ms).
 */

const hud = document.getElementById("hud");
const stage = document.getElementById("stage");

const params = new URLSearchParams(window.location.search);
const num = (key, fallback) => {
  const v = parseFloat(params.get(key));
  return Number.isFinite(v) ? v : fallback;
};

function stored(key) {
  try { return localStorage.getItem(key); } catch (err) { return null; }  // file:// or private mode
}
function store(key, value) {
  try { localStorage.setItem(key, value); } catch (err) { /* ignore */ }
}

let palette = [params.get("palette"), stored("mb-palette")].find((p) => p in PALETTES) || "ultra";
let LUT = buildLut(palette);

// Tour stops as numbers; deep stops give x and y as decimal text, which
// TOUR_CENTERS keeps exactly.
const TOUR = LOCATIONS.map(([x, y, d, m]) => [Number(x), Number(y), d, m]);
const TOUR_NAMES = LOCATIONS.map((l) => l[4] || "");
let locations = TOUR;
let names = TOUR_NAMES;
let once = params.has("once");
const atText = (params.get("at") || "").split(",");
const at = atText.map(Number);
const TOUR_CENTERS = LOCATIONS.map(([x, y, d]) => {
  const bits = precisionFor(d / 3 / 8192);
  const big = (v) => (typeof v === "string" ? bigFromString(v, bits) : bigFromDouble(v, bits));
  return { x: big(x), y: big(y) };
});
let centers = TOUR_CENTERS;
if (at.length >= 3 && at.length <= 4 && at.every(Number.isFinite)) {
  locations = [[at[0], at[1], at[2], at[3] || 256]];
  // Keep every digit given: ?at= may be deeper than doubles can represent.
  const bits = precisionFor(at[2] / 3 / 8192);
  const exact = (k) => bigFromString(atText[k], bits) || bigFromDouble(at[k], bits);
  centers = [{ x: exact(0), y: exact(1) }];
  names = [""];
  once = true;
}
let n = locations.length;
let iterations = Math.max(1, Math.floor(num("iterations", 500)));
let current = ((Math.floor(num("location", 0)) % n) + n) % n;  // stop on screen (index into locations)
// The tour visits the stops in random order: `order` is a shuffle of all
// of them starting with `first`, reshuffled each time round; `pos` is the
// position in it. Stops in the same neighborhood (centers within 0.05) are
// kept apart, so a short hop isn't followed by a long dive back out.
function shuffled(first) {
  const near = (a, b) => Math.hypot(locations[a][0] - locations[b][0], locations[a][1] - locations[b][1]) < 0.05;
  let best = null;
  for (let attempt = 0; attempt < 200; attempt++) {
    const rest = [...Array(n).keys()].filter((i) => i !== first);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    best = [first, ...rest];
    if (best.every((s, i) => i === 0 || !near(best[i - 1], s))) break;
  }
  return best;
}
let order = shuffled(current), pos = 0;
let view = locations[current].slice();  // [x, y, distance, maxColor] of the target
let center = centers[current];  // exact target center; view[0..1] round it to doubles
let hiRes = params.get("hd") === "1";  // perturbation rendering (CPU renderer)
let mode = "tour";            // "tour" or "explore"
let paused = false;
let holdTimer = 0, hudTimer = 0, saveTimer = 0;
let rendered = false;
let autoRange = params.get("auto") !== "0";  // stretch colors to what's on screen
const COLOR_MODES = ["auto", "trap", "escape"];  // orbit trap, escape time, or pick
let colorMode = COLOR_MODES.includes(params.get("color")) ? params.get("color") : "auto";
// Camera speed (e-folds per second at peak, see camera.js) and the minimum
// click-zoom and dive durations it may stretch.
let anim = { clickMs: 500, dive: true, diveMs: 4000, speed: 2 };
try { anim = { ...anim, ...JSON.parse(stored("mb-anim") || "{}") }; } catch (err) { /* ignore */ }
// The click-zoom and dive durations are no longer settings (camera speed
// replaced them): ignore values saved by older versions.
anim.clickMs = 500;
anim.diveMs = 4000;
// Tour hold (ms): ?hold= wins, then the saved preference, then 5 s.
let hold = params.has("hold") ? Math.max(0, num("hold", 5)) * 1000
  : Number.isFinite(anim.hold) ? Math.max(0, anim.hold) : 5000;
const RENDERERS = ["auto", "gpu", "cpu"];
let rendererPref = params.get("gpu") === "0" ? "cpu"
  : RENDERERS.includes(stored("mb-renderer")) ? stored("mb-renderer") : "auto";
let renderer = cpuRenderer;

// Deeper zooms need more iterations to resolve detail near the set.
let iterationScale = 1;  // adjusted with - and +
const iterationsFor = (distance) =>
  Math.round(Math.max(iterations, 200 * Math.log10(6.75 / distance)));

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.resize(Math.round(window.innerWidth * dpr), Math.round(window.innerHeight * dpr));
}

const target = () => ({ center, distance: view[2], maxColor: view[3] });

// --- setters (shared by keys and the settings dialog) ------------------------------

// Picks the renderer: "auto" (GPU if available), "gpu" or "cpu".
function setRenderer(pref) {
  rendererPref = pref;
  if (params.get("gpu") !== "0") store("mb-renderer", pref);
  const next = pref !== "cpu" && gpuRenderer.available ? gpuRenderer : cpuRenderer;
  if (next !== renderer) {
    renderer.canvas.hidden = true;
    renderer.stop();
    renderer = next;
    renderer.canvas.hidden = false;
    resize();
    rerender();
  }
}

function setHiRes(on) { hiRes = on; rerender(); }
function setColorMode(m) { colorMode = m; rerender(); }
function cycleColorMode() { setColorMode(COLOR_MODES[(COLOR_MODES.indexOf(colorMode) + 1) % COLOR_MODES.length]); }
function setAutoRange(on) { autoRange = on; rerender(); }
function setPalette(name) {
  palette = name;
  LUT = buildLut(palette);
  cpuRenderer.setPalette(LUT);
  gpuRenderer.setPalette(LUT);
  store("mb-palette", palette);
  rerender();
}
function setIterationScale(s) { iterationScale = s; rerender(); }
function setMaxColor(maxColor) { view[3] = maxColor; autoRange = false; rerender(); }
function setAnim(prefs) {
  anim = { ...anim, ...prefs };
  if (Number.isFinite(prefs.hold)) hold = prefs.hold;
  store("mb-anim", JSON.stringify(anim));
  scheduleAdvance();
}

// Re-renders the current target after a settings change.
function rerender() {
  rendered = false;
  clearTimeout(holdTimer);
  camera.target = { ...camera.target, ...target() };
  camera.refresh();
  saveState();
  updateHud();
}

// --- HUD and URL -------------------------------------------------------------------

// Enough decimal places to place the view to well under a pixel.
function fmt(v, distance) {
  return bigToString(v, Math.max(4, Math.ceil(-Math.log10(distance)) + 4));
}

// max_color for mb.py: in auto mode, the top of the measured range.
function currentMaxColor() {
  const { range } = renderer.status();
  return Math.round(autoRange && range && !range.smooth ? range.hi + 1 : view[3]);
}

function coords() {
  const distance = view[2];
  return `${fmt(center.x, distance)} ${fmt(center.y, distance)} ${parseFloat(distance.toPrecision(4))} ${currentMaxColor()}`;
}

function colorInfo() {
  const { range } = renderer.status();
  const coloring = range && range.smooth
    ? "escape time" : `orbit trap (${autoRange ? "auto" : "fixed"} range)`;
  const precision = renderer.name === "gpu" ? "gpu" : hiRes ? "hi-res" : "lo-res";
  return `${palette}, ${colorMode} color: ${coloring}, ${precision}`;
}

function showHud(text, sticky = false, ms = 3000) {
  hud.textContent = text;
  hud.classList.add("show");
  clearTimeout(hudTimer);
  if (!sticky) hudTimer = setTimeout(() => hud.classList.remove("show"), ms);
}

const touch = () => !!(window.matchMedia && matchMedia("(pointer: coarse)").matches);

// Magnification of what's on screen now (the camera, not the target).
function zoomText() {
  const m = 6.75 / (camera.cam ? camera.cam.distance : view[2]);
  return "zoom ×" + (m < 1000 ? m.toFixed(m < 10 ? 1 : 0) : m.toExponential(1).replace("e+", "e"));
}

function updateHud(extra = "", ms) {
  if (mode === "explore") {
    const keys = touch()
      ? "tap: zoom in  drag: pan  pinch: zoom  ▶: back to the tour"
      : "click: in  shift-click: out  wheel: zoom  drag: pan  p: palette  a: auto color\n" +
        "[ ]: color range  - +: iterations  h: hi-res  o: coloring  c: copy  s: settings  r: reset";
    showHud(`${coords()}   iterations ${renderer.status().effectiveIterations}   ${colorInfo()}${extra}\n` +
            `tour paused: ${touch() ? "▶" : "space or esc"} to resume\n${keys}`, true);
  } else {
    const moving = camera.animating();
    const state = paused ? "  (paused)" : "";
    const keys = touch() ? "" : "\nspace: pause  ← →: previous/next  click: explore  s: settings";
    showHud(`${pos + 1}/${n}  ${moving ? "→ " : ""}${names[current]}\n${zoomText()}${state}${extra}${keys}`,
            paused || moving, ms);
  }
  settings.update();
}

// While the camera glides between stops, keep the HUD's zoom current.
setInterval(() => {
  if (mode === "tour" && camera.animating() && hud.classList.contains("show")) updateHud();
}, 250);

// Space and the on-screen play button: in the tour, pause or resume (a
// dive freezes where it is); while exploring, back to the tour.
function togglePause() {
  if (mode === "explore") { go(0); return; }
  paused = !paused;
  if (paused) camera.pause(); else camera.resume();
  scheduleAdvance();
  updateHud();
}

// Mirrors the current view into the URL, so reloading picks up from here.
function saveState() {
  const q = new URLSearchParams(window.location.search);
  if (mode === "explore") {
    q.set("at", coords().split(" ").join(","));
    q.delete("location");
  } else if (locations === TOUR) {
    q.set("location", String(current));
    q.delete("at");
  }
  if (hiRes) q.set("hd", "1"); else q.delete("hd");
  if (autoRange) q.delete("auto"); else q.set("auto", "0");
  if (colorMode === "auto") q.delete("color"); else q.set("color", colorMode);
  if (!once) q.delete("once");
  if (q.has("palette")) q.set("palette", palette);
  const text = q.toString().replace(/%2C/g, ",");
  try {
    history.replaceState(null, "", text ? `?${text}` : window.location.pathname);
  } catch (err) { /* some file:// setups refuse */ }
}

// --- navigation --------------------------------------------------------------------

// Shows view v (with center already set): how = "jump" (cut), "zoom" (eased
// click zoom) or "dive" (tour transition).
function show(v, how = "jump") {
  clearTimeout(holdTimer);
  view = v;
  rendered = false;
  saveState();
  if (how === "jump") camera.jumpTo(target());
  else camera.animateTo(target(), how);
}

function onRendered() {
  rendered = true;
  saveState();
  if (hud.classList.contains("show")) updateHud();
  scheduleAdvance();
}

function scheduleAdvance() {
  clearTimeout(holdTimer);
  if (mode === "tour" && !paused && !once && rendered) {
    holdTimer = setTimeout(() => go(1), hold);
  }
}

// Back to the start of the built-in tour, as on a fresh load: drops a ?at=
// view and ?once, unpauses, and resets the iteration multiplier. Palette and
// coloring preferences stay.
function resetTour() {
  locations = TOUR;
  centers = TOUR_CENTERS;
  names = TOUR_NAMES;
  n = TOUR.length;
  once = false;
  paused = false;
  iterationScale = 1;
  current = 0;
  order = shuffled(0);
  pos = 0;
  go(0);
}

function go(delta) {
  const moving = delta !== 0 || mode === "explore";
  mode = "tour";
  pos += delta;
  if (pos >= n) { order = shuffled(current); pos = n > 1 ? 1 : 0; }  // next round, new order
  else if (pos < 0) pos = n - 1;
  current = order[pos];
  if (names[current]) document.getElementById("announce").textContent = names[current];
  center = centers[current];
  show(locations[current].slice(), moving && anim.dive && renderer.name === "gpu" ? "dive" : "jump");
  updateHud();
}

// Click zoom: (x, y) in CSS pixels on the stage. The clicked point (relative
// to what's on screen now) becomes the new center.
function zoom(x, y, factor) {
  const cam = camera.cam;
  if (!cam) return;
  const step = cam.distance / 3 / stage.clientWidth;
  const dx = (x - stage.clientWidth / 2) * step;
  const dy = (y - stage.clientHeight / 2) * step;
  const distance = view[2] * factor;
  // Never drop bits the center already has, so zooming back in returns exactly.
  const bits = Math.max(precisionFor(distance / 3 / 8192), cam.center.x.e, cam.center.y.e);
  const c = {
    x: bigAdd(rescale(cam.center.x, bits), bigFromDouble(dx, bits)),
    y: bigAdd(rescale(cam.center.y, bits), bigFromDouble(dy, bits)),
  };
  if (factor < 1 && distance < renderer.minDistance(bigToDouble(c.x), bigToDouble(c.y))) {
    updateHud(renderer.name === "gpu" || hiRes
      ? "\nmax zoom: pixel offsets would underflow"
      : "\nmax zoom: 64-bit floats can't resolve any deeper here (h: hi-res)");
    return;
  }
  mode = "explore";
  center = c;
  show([bigToDouble(c.x), bigToDouble(c.y), distance, view[3]], "zoom");
  updateHud();
}

// Wheel, pinch and drag: the camera already shows (center, distance); make it
// the page's view too. Returns false (and leaves the view) past the zoom
// limit, so the camera can stop there.
function moveTo(c, distance) {
  // Only refuse going deeper: a view already past the limit (e.g. after
  // switching to lo-res) can still pan and zoom out.
  if (distance < view[2] && distance < renderer.minDistance(bigToDouble(c.x), bigToDouble(c.y))) return false;
  clearTimeout(holdTimer);
  mode = "explore";
  rendered = false;
  center = c;
  view = [bigToDouble(c.x), bigToDouble(c.y), distance, view[3]];
  if (hud.classList.contains("show")) updateHud();
  // Throttled: browsers rate-limit history.replaceState.
  if (!saveTimer) saveTimer = setTimeout(() => { saveTimer = 0; saveState(); }, 300);
  return true;
}

// --- keys --------------------------------------------------------------------------

document.addEventListener("keydown", (e) => {
  // Buttons keep Space and Enter for themselves.
  if (settings.isOpen() || (e.target instanceof Element && e.target.closest("input, select, textarea, dialog, button"))) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // Letters work with Caps Lock or Shift too.
  switch (e.key.length === 1 ? e.key.toLowerCase() : e.key) {
    case " ":
      e.preventDefault();
      togglePause();
      break;
    case "n": case "ArrowRight": go(1); break;
    case "ArrowLeft": go(-1); break;
    case "Escape": if (mode === "explore") go(0); break;
    case "[": case "]":
      if (mode !== "explore") break;
      // Manual adjustment starts from whatever range is on screen now.
      setMaxColor(Math.max(2, currentMaxColor() * (e.key === "]" ? 1.25 : 0.8)));
      break;
    case "o": cycleColorMode(); break;
    case "a": setAutoRange(!autoRange); break;
    case "h": setHiRes(!hiRes); break;
    case "p": setPalette(PALETTE_NAMES[(PALETTE_NAMES.indexOf(palette) + 1) % PALETTE_NAMES.length]); break;
    case "-": case "+": case "=":
      if (mode !== "explore") break;
      setIterationScale(iterationScale * (e.key === "-" ? 0.5 : 2));
      break;
    case "c":
      if (mode !== "explore") break;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(coords()).then(
          () => updateHud("   copied"), () => updateHud("   copy failed"));
      }
      break;
    case "s": settings.open(); break;
    case "r": resetTour(); break;
  }
});

let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resize(); rerender(); }, 200);
});

// --- start -------------------------------------------------------------------------

cpuRenderer.init();
gpuRenderer.init();
camera.onRendered = onRendered;
camera.init();
settings.init();
setRenderer(rendererPref);
resize();
show(view);
updateHud("", 8000);
</script>
</body>
</html>
